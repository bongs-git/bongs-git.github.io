# Builds the installable Meta Quest app (APK) on GitHub's servers with Meta's Bubblewrap,
# then attaches it to the "quest-app" release of this repo.
name: Build Quest app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/quest-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    # Two apps from the same site: INDAI (immersive, scenes + passthrough) and INDAI Window
    # (a regular window that sits in your Quest home / Loft).
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: immersive
            template: twa-manifest.template.json
            apk: indai-quest.apk
          - id: window
            template: twa-manifest.window.template.json
            apk: indai-window.apk
    concurrency: quest-apk-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_PASS: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
      APP_BASE: /jarvis-command-center   # the app lives in the jarvis-command-center repo's site
    steps:
      - name: Check for the signing password
        id: gate
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::Skipped: add the QUEST_KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions), then run this workflow again."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'

      - name: Work out the site address
        if: steps.gate.outputs.ok == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          echo "HOST=$OWNER.github.io" >> "$GITHUB_ENV"
          if [ -n "$APP_BASE" ]; then echo "BASE=$APP_BASE" >> "$GITHUB_ENV";
          elif [ "$REPO" = "$OWNER.github.io" ]; then echo "BASE=" >> "$GITHUB_ENV"; else echo "BASE=/$REPO" >> "$GITHUB_ENV"; fi
          # The app verifies itself through https://$OWNER.github.io/.well-known/assetlinks.json
          # (served from the $OWNER.github.io repo when this is a project site).

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: '20'

      - name: Android build tools
        if: steps.gate.outputs.ok == 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-32" > /dev/null
          # Bubblewrap expects sdkmanager at <sdk>/bin; GitHub's runners keep it in cmdline-tools/latest/bin
          [ -e "$ANDROID_HOME/bin" ] || ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin" || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          ls "$ANDROID_HOME/bin/sdkmanager" "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Install Meta's Bubblewrap
        if: steps.gate.outputs.ok == 'true'
        run: npm install --global @meta-quest/bubblewrap-cli@1.24.1

      - name: Wait for the site to be live
        if: steps.gate.outputs.ok == 'true'
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "https://$HOST$BASE/manifest.webmanifest" > /dev/null && curl -fsS "https://$HOST/.well-known/assetlinks.json" > /dev/null; then exit 0; fi
            sleep 15
          done
          echo "::error::https://$HOST$BASE is not live yet. Check that GitHub Pages is on, then run this workflow again."
          exit 1

      - name: Generate the Android project
        if: steps.gate.outputs.ok == 'true'
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          mkdir -p build-apk && cd build-apk
          sed -e "s#__HOST__#$HOST#g" -e "s#__BASE__#$BASE#g" -e "s#__VERSION_CODE__#$GITHUB_RUN_NUMBER#g" \
            ../android/${{ matrix.template }} > twa-manifest.json
          cp ../android/jarvis-release.keystore android.keystore
          bubblewrap update --skipVersionUpgrade < /dev/null
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Build and sign the APK
        if: steps.gate.outputs.ok == 'true'
        working-directory: build-apk
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation < /dev/null
          cp app-release-signed.apk ../${{ matrix.apk }}

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: ${{ matrix.id }}-apk
          path: ${{ matrix.apk }}

      - name: Attach to the "quest-app" release
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="indai-quest.apk: INDAI in mixed reality and virtual scenes. indai-window.apk: INDAI as a window in your Quest home (the Loft). Steps are in INSTALL-QUEST-APP.md."
          gh release view quest-app > /dev/null 2>&1 || gh release create quest-app --title "INDAI for Meta Quest" --notes "$NOTES" || true
          gh release edit quest-app --title "INDAI for Meta Quest" --notes "$NOTES" || true
          gh release upload quest-app "${{ matrix.apk }}" --clobber
          gh release delete-asset quest-app jarvis-quest.apk --yes || true
